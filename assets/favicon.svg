  <line x1="8" y1="56" x2="56" y2="56" stroke="#2155D9" stroke-width="0.75" stroke-opacity="0.5"/>
  <line x1="8" y1="8" x2="8" y2="56" stroke="#2155D9" stroke-width="0.75" stroke-opacity="0.5"/>
  <line x1="56" y1="8" x2="56" y2="56" stroke="#2155D9" stroke-width="0.75" stroke-opacity="0.5"/>
  <line x1="32" y1="4" x2="32" y2="60" stroke="#2155D9" stroke-width="0.5" stroke-dasharray="2 2" stroke-opacity="0.4"/>
  <line x1="4" y1="32" x2="60" y2="32" stroke="#2155D9" stroke-width="0.5" stroke-dasharray="2 2" stroke-opacity="0.4"/>
